apiVersion: v1
kind: Service
metadata:
  name: renthub
  labels:
    app.kubernetes.io/name: renthub
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: renthub
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: renthub
automountServiceAccountToken: false
