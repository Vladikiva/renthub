apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: renthub

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.example.yaml
  - postgres.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: renthub
