apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: renthub
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: renthub
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - port: 5432
          protocol: TCP
    - ports:
        - port: 53
          protocol: UDP
