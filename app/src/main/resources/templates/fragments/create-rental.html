<div layout:decorate="~{index}" layout:fragment="content">
    <div class="container py-5">
        <!-- Заголовок с иконкой -->
        <div class="d-flex align-items-center mb-4">
            <i class="bi bi-house-add-fill text-primary me-2" style="font-size: 1.8rem;"></i>
            <h1 class="mb-0">Создание аренды жилья</h1>
        </div>
        <p class="lead text-muted">Добавьте новую аренду для конкретных клиентов</p>

        <!-- Карточка с формой -->
        <div class="card shadow-sm border-0 rounded-3 overflow-hidden">
            <div class="card-body p-4">
                <hr class="my-4">

                <div th:switch="${#lists.size(stations)}">
                    <p th:case="0" class="text-center text-danger py-4">Нет доступных станций.</p>

                    <form action="/employee/create-rental/process" method="post" th:case="*" th:object="${rental}"
                          class="needs-validation" novalidate>

                        <!-- Город -->
                        <div class="form-group row mb-3 align-items-center">
                            <label class="col-sm-2 col-form-label fw-semibold" for="rentalStation">Город</label>
                            <div class="col-sm-10">
                                <select class="form-select form-select-sm rounded-pill" id="rentalStation"
                                        onchange="this.form.action='/employee/create-rental/refresh'; this.form.submit()"
                                        th:field="*{rentalStation}" required>
                                    <option th:each="station : ${stations}" th:text="${station.city}"
                                            th:value="${station.id}"></option>
                                </select>
                                <small class="text-danger" th:errors="*{rentalStation}"
                                       th:if="${#fields.hasErrors('rentalStation')}"></small>
                                <div class="invalid-feedback">Выберите город</div>
                            </div>
                        </div>

                        <div th:switch="${#lists.size(houses)}">
                            <p class="text-center info text-muted py-4" th:case="0">
                                <i class="bi bi-building text-secondary me-2"></i>
                                0 домов найдено.<br>В этом городе нет доступных домов.
                            </p>

                            <div th:case="*">
                                <!-- Количество комнат -->
                                <div class="form-group row mb-3 align-items-center">
                                    <label class="col-sm-2 col-form-label fw-semibold" for="house">Количество комнат</label>
                                    <div class="col-sm-10">
                                        <select class="form-select form-select-sm rounded-pill" id="house" th:field="*{house}" required>
                                            <option th:each="house : ${houses}"
                                                    th:text="${house}"
                                                    th:value="${house.houseNr}">
                                            </option>
                                        </select>
                                        <small class="text-danger" th:errors="*{house}"
                                               th:if="${#fields.hasErrors('house')}"></small>
                                        <small class="text-danger" th:text="${houseMismatchError}"></small>
                                    </div>
                                </div>

                                <!-- Клиент -->
                                <div class="form-group row mb-3 align-items-center">
                                    <label class="col-sm-2 col-form-label fw-semibold" for="driver">Клиент</label>
                                    <div class="col-sm-10">
                                        <select class="form-select form-select-sm rounded-pill" id="driver" th:field="*{driver}" required>
                                            <option th:each="customer : ${customers}"
                                                    th:text="${customer}"
                                                    th:value="${customer.customerNumber}">
                                            </option>
                                        </select>
                                        <small class="text-danger" th:errors="*{driver}"
                                               th:if="${#fields.hasErrors('driver')}"></small>
                                    </div>
                                </div>

                                <!-- Дата аренды -->
                                <div class="form-group row mb-3 align-items-center">
                                    <label class="col-sm-2 col-form-label fw-semibold" for="rentalDate">Дата аренды</label>
                                    <div class="col-sm-10">
                                        <input class="form-control form-control-sm rounded-pill" id="rentalDate"
                                               th:field="*{rentalDate}" type="date" required>
                                        <small class="text-danger" th:errors="*{rentalDate}"
                                               th:if="${#fields.hasErrors('rentalDate')}"></small>
                                    </div>
                                </div>

                                <hr class="my-4">

                                <!-- Кнопка отправки -->
                                <div class="form-group row">
                                    <div class="offset-sm-2 col-md-10 d-grid">
                                        <button type="submit" class="btn btn-lg btn-primary rounded-pill shadow-sm">
                                            <i class="bi bi-check-circle me-1"></i> Создать
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
