<!DOCTYPE html>
<html lang="ru"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head th:replace="/fragments/shared/head"></head>
<body class="bg-light">
<!-- Темная тема для навигации -->
<div class="d-flex" id="wrapper">
    <!-- Боковое меню -->
    <div class="bg-dark border-end shadow-sm" id="sidebar-wrapper" th:replace="/fragments/shared/sidenav"></div>

    <!-- Основной контент -->
    <div id="page-content-wrapper" class="flex-grow-1">
        <!-- Верхняя панель -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm" th:replace="/fragments/shared/topnav"></nav>

        <!-- Контентная область -->
        <div class="container-fluid py-4">
            <div class="card shadow-sm border-0 rounded-3 overflow-hidden">
                <div class="card-body p-4">
                    <div layout:fragment="content"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Стилизованные кнопки управления меню -->
<button class="btn btn-primary rounded-circle shadow-sm position-fixed start-0 bottom-50 translate-middle-y ms-3 z-3"
        id="menu-toggle" style="width: 40px; height: 40px;">
    <i class="bi bi-list text-white"></i>
</button>

<!-- Подключение Bootstrap JS и иконок -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<script>
    $(document).ready(() => {
        // Сохранение состояния меню
        let item = sessionStorage.getItem("closed");
        $("#wrapper").addClass(item ? item === "true" ? "closed" : "open" : "");

        // Анимация при изменении состояния
        $("#menu-toggle").click(function (e) {
            e.preventDefault();
            $("#wrapper").toggleClass("closed");
            sessionStorage.setItem("closed", $(wrapper).hasClass("closed"));

            // Анимация кнопки
            $(this).find('i').toggleClass('bi-list bi-x');
        });
    });
</script>
</body>
</html>
