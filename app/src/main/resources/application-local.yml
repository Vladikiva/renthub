# Zero-dependency profile: in-memory H2 running in PostgreSQL compatibility mode,
# so the very same Flyway migrations are applied as in production.
spring:
  datasource:
    url: jdbc:h2:mem:renthub;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: false

management:
  tracing:
    sampling:
      probability: 1.0
