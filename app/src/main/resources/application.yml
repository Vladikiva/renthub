spring:
  application:
    name: renthub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/renthub}
    username: ${DB_USERNAME:renthub}
    password: ${DB_PASSWORD:renthub}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 3000
      validation-timeout: 2000
      initialization-fail-timeout: -1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:100}
    accesslog:
      enabled: false

renthub:
  security:
    users:
      - username: ${ADMIN_USERNAME:admin}
        password: ${ADMIN_PASSWORD:admin}
        role: ADMIN
      - username: ${EMPLOYEE_USERNAME:emp}
        password: ${EMPLOYEE_PASSWORD:emp}
        role: EMPLOYEE

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,env,flyway,threaddump,heapdump
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  observations:
    key-values:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
  info:
    env:
      enabled: true
    git:
      mode: full

info:
  app:
    name: ${spring.application.name}
    version: ${APP_VERSION:dev}
    environment: ${APP_ENVIRONMENT:local}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    at.htlstp.aslan.houserent: ${LOG_LEVEL_APP:INFO}
