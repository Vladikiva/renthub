<div layout:decorate="~{index}" layout:fragment="content">
    <div class="container py-5">
        <!-- Заголовок с иконкой -->
        <div class="d-flex align-items-center mb-4">
            <i class="bi bi-door-closed-fill text-primary me-2" style="font-size: 1.8rem;"></i>
            <h1 class="mb-0">Завершение аренды</h1>
        </div>
        <p class="lead text-muted">Для завершения аренды заполните информацию ниже</p>

        <!-- Карточка с формой -->
        <div class="card shadow-sm border-0 rounded-3 overflow-hidden">
            <div class="card-body p-4">
                <hr class="my-4">

                <form method="post" th:action="@{'/employee/finish-rental/' + ${finishRentalBean.id}}"
                      th:object="${finishRentalBean}" class="needs-validation" novalidate>

                    <!-- Блок информации (только для чтения) -->
                    <div class="bg-light rounded-3 p-3 mb-4">
                        <h5 class="text-primary mb-3">Информация об аренде</h5>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold text-secondary" for="id">ID</label>
                                <input class="form-control form-control-sm bg-white" disabled id="id" th:value="*{id}">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold text-secondary" for="customer">Клиент</label>
                                <input class="form-control form-control-sm bg-white" disabled id="customer" th:value="*{driver}">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold text-secondary" for="house">Количество комнат</label>
                                <input class="form-control form-control-sm bg-white" disabled id="house" th:value="*{house}">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold text-secondary" for="rentalStation">Город</label>
                                <input class="form-control form-control-sm bg-white" disabled id="rentalStation"
                                       th:value="*{rentalStation.city}">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold text-secondary" for="rentalDate">Дата аренды</label>
                                <input class="form-control form-control-sm bg-white" disabled id="rentalDate" th:value="*{rentalDate}">
                            </div>
                        </div>
                    </div>

                    <!-- Блок ввода данных -->
                    <h5 class="text-primary mt-4 mb-3">Детали завершения</h5>

                    <!-- Дата окончания -->
                    <div class="form-group row mb-3 align-items-center">
                        <label class="col-sm-2 col-form-label fw-semibold" for="returnDate">Дата окончания</label>
                        <div class="col-sm-10">
                            <input class="form-control form-control-sm rounded-pill" id="returnDate"
                                   th:field="*{returnDate}" type="date" required>
                            <small class="form-text text-danger" th:errors="*{returnDate}"
                                   th:if="${#fields.hasErrors('returnDate')}"></small>
                            <small class="text-danger" th:text="${returnDateError}"></small>
                            <div class="invalid-feedback">Выберите дату окончания</div>
                        </div>
                    </div>

                    <!-- Станция возврата -->
                    <div class="form-group row mb-3 align-items-center">
                        <label class="col-sm-2 col-form-label fw-semibold" for="returnStation">Станция возврата</label>
                        <div class="col-sm-10">
                            <select class="form-select form-select-sm rounded-pill" id="returnStation"
                                    th:field="*{returnStation}" required>
                                <option th:each="station : ${stations}" th:text="${station.city}"
                                        th:value="${station.id}"></option>
                            </select>
                            <small class="text-danger" th:errors="*{returnStation}"
                                   th:if="${#fields.hasErrors('returnStation')}"></small>
                            <div class="invalid-feedback">Выберите станцию возврата</div>
                        </div>
                    </div>

                    <!-- Срок аренды -->
                    <div class="form-group row mb-3 align-items-center">
                        <label class="col-sm-2 col-form-label fw-semibold" for="km">Срок аренды (месяцы)</label>
                        <div class="col-sm-10">
                            <input class="form-control form-control-sm rounded-pill" id="km"
                                   th:field="*{km}" type="number" min="1" required>
                            <small class="text-danger" th:errors="*{km}"
                                   th:if="${#fields.hasErrors('km')}"></small>
                            <div class="invalid-feedback">Введите количество месяцев</div>
                        </div>
                    </div>

                    <hr class="my-4">

                    <!-- Кнопки -->
                    <div class="form-group row">
                        <div class="offset-sm-2 col-md-10 d-grid gap-2 d-md-block">
                            <button type="submit" class="btn btn-lg btn-success rounded-pill shadow-sm px-4">
                                <i class="bi bi-check-circle me-1"></i> Завершить
                            </button>
                            <a class="btn btn-lg btn-outline-danger rounded-pill shadow-sm px-4" href="/employee/running-rentals">
                                <i class="bi bi-x-circle me-1"></i> Отмена
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
