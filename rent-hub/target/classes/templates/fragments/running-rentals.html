<div layout:decorate="~{index}" layout:fragment="content">
    <div class="container py-5">
        <!-- Заголовок с иконкой -->
        <div class="d-flex align-items-center mb-4">
            <i class="bi bi-building text-primary me-2" style="font-size: 1.8rem;"></i>
            <h1 class="mb-0">Арендованные дома</h1>
        </div>
        <p class="lead text-muted">Список текущих арендованных домов</p>

        <!-- Карточка с таблицей -->
        <div class="card shadow-sm border-0 rounded-3 overflow-hidden mt-4">
            <div class="card-body p-4">
                <!-- Алерты -->
                <div th:if="${!error.isBlank()}" class="alert alert-danger alert-dismissible fade show rounded-pill" role="alert">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${error}"></span>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div th:if="${!success.isBlank()}" class="alert alert-success alert-dismissible fade show rounded-pill" role="alert">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span th:text="${success}"></span>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Контент -->
                <div th:switch="${rentalsListSize}" th:with="rentalsListSize=${#lists.size(rentals)}">
                    <div class="text-center py-5" th:case="0">
                        <i class="bi bi-building-fill-slash text-secondary mb-3" style="font-size: 3rem;"></i>
                        <h4 class="text-muted mb-0">Нет активных аренд</h4>
                        <p class="text-muted mt-2">В данный момент ни один клиент не арендовал дом.</p>
                    </div>

                    <div th:case="*" class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <caption class="text-center py-3 text-muted small">
                                <span th:text="${rentalsListSize + (rentalsListSize == 1 ? ' аренда' : ' аренд') + ' найдено'}"></span>
                            </caption>
                            <thead class="table-light">
                            <tr>
                                <th scope="col" class="text-uppercase fw-semibold small">#</th>
                                <th scope="col" class="text-uppercase fw-semibold small">Дата аренды</th>
                                <th scope="col" class="text-uppercase fw-semibold small">Город</th>
                                <th scope="col" class="text-uppercase fw-semibold small">Клиент</th>
                                <th scope="col" class="text-uppercase fw-semibold small">Комнат</th>
                                <th scope="col" class="text-uppercase fw-semibold small text-end">Действия</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="rental : ${rentals}" class="border-bottom">
                                <td><span class="badge bg-primary-subtle text-primary fw-normal">ID: <span th:text="${rental.id}"></span></span></td>
                                <td th:text="${rental.rentalDate}"></td>
                                <td th:text="${rental.rentalStation.city}"></td>
                                <td th:text="${rental.driver}"></td>
                                <td>
                                    <span class="badge bg-info-subtle text-info fw-normal">
                                        <i class="bi bi-door-open-fill me-1"></i>
                                        <span th:text="${rental.house}"></span>
                                    </span>
                                </td>
                                <td class="text-end">
                                    <a class="btn btn-warning btn-sm rounded-pill px-3"
                                       th:href="@{'finish-rental/' + ${rental.id}}">
                                        <i class="bi bi-flag-fill me-1"></i> Завершить
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
